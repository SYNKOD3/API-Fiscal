spring:
  application:
    name: fiscal-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:fiscaldb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

springdoc:
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    api-key: ${APP_API_KEY:change-me}
    jwt:
      enabled: ${JWT_AUTH_ENABLED:false}
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:fiscal-platform}
      audience: ${JWT_AUDIENCE:fiscal-api}
  fiscal:
    provider: ${FISCAL_PROVIDER:STUB}
    stub-online: ${FISCAL_STUB_ONLINE:true}
    unavailable-states: ${FISCAL_UNAVAILABLE_STATES:}
  retry:
    fixed-delay-ms: ${FISCAL_RETRY_DELAY_MS:30000}
    batch-size: ${FISCAL_RETRY_BATCH_SIZE:50}
  dev-console:
    enabled: ${APP_DEV_CONSOLE_ENABLED:true}
  open-api:
    public-access: ${OPENAPI_PUBLIC_ACCESS:true}
  certificates:
    storage-path: ${CERTIFICATE_STORAGE_PATH:certificates}
    max-size-bytes: ${CERTIFICATE_MAX_SIZE_BYTES:5242880}

logging:
  level:
    br.com.antigravity.fiscalapi: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

springdoc:
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /v3/api-docs
  writer-with-order-by-keys: true

app:
  security:
    api-key: ${APP_API_KEY}
    jwt:
      enabled: ${JWT_AUTH_ENABLED:true}
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:fiscal-platform}
      audience: ${JWT_AUDIENCE:fiscal-api}
  fiscal:
    provider: ${FISCAL_PROVIDER:LIBRARY}
    stub-online: false
    unavailable-states: ${FISCAL_UNAVAILABLE_STATES:}
  retry:
    fixed-delay-ms: ${FISCAL_RETRY_DELAY_MS:30000}
    batch-size: ${FISCAL_RETRY_BATCH_SIZE:50}
  dev-console:
    enabled: ${APP_DEV_CONSOLE_ENABLED:false}
  open-api:
    public-access: ${OPENAPI_PUBLIC_ACCESS:false}
  certificates:
    storage-path: ${CERTIFICATE_STORAGE_PATH:/var/lib/fiscal-api/certificates}
    max-size-bytes: ${CERTIFICATE_MAX_SIZE_BYTES:5242880}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    br.com.antigravity.fiscalapi: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
