services:
  postgres:
    image: postgres:16-alpine
    container_name: fiscal-api-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiscal_api}
      POSTGRES_USER: ${POSTGRES_USER:-fiscal_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fiscal_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiscal_api} -d ${POSTGRES_DB:-fiscal_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fiscal-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fiscal_api}
      DATABASE_USERNAME: ${POSTGRES_USER:-fiscal_api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      API_KEY_AUTH_ENABLED: ${API_KEY_AUTH_ENABLED:-false}
      APP_API_KEY: ${APP_API_KEY:-}
      APP_SECRETS_KEY: ${APP_SECRETS_KEY}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-fiscal-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fiscal-api}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_DEFAULT_SCOPES: ${AUTH_DEFAULT_SCOPES:-fiscal:companies:write,fiscal:companies:read,fiscal:certificates:write,fiscal:certificates:read,fiscal:documents:issue,fiscal:documents:retry,fiscal:documents:read,fiscal:audit:read,fiscal:logs:read,fiscal:sefaz:read}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-60}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-LIBRARY}
      FISCAL_UNAVAILABLE_STATES: ${FISCAL_UNAVAILABLE_STATES:-}
      CERTIFICATE_STORAGE_PATH: ${CERTIFICATE_STORAGE_PATH:-/var/lib/fiscal-api/certificates}
      CERTIFICATE_MAX_SIZE_BYTES: ${CERTIFICATE_MAX_SIZE_BYTES:-5242880}
      APP_DEV_CONSOLE_ENABLED: ${APP_DEV_CONSOLE_ENABLED:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      OPENAPI_PUBLIC_ACCESS: ${OPENAPI_PUBLIC_ACCESS:-false}
    ports:
      - "8081:8081"
    volumes:
      - fiscal_api_certificates:/var/lib/fiscal-api/certificates
    restart: unless-stopped

volumes:
  fiscal_api_postgres:
  fiscal_api_certificates:
